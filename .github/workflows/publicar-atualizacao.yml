name: Publicar Atualizacao Financeiro Master Pro

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao. Exemplo: 2026.291"
        required: true
        type: string
      notas:
        description: "Notas da atualizacao"
        required: true
        type: string
      arquivo:
        description: "Nome do ZIP enviado ao repositorio"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Verificar pacote
        shell: bash
        run: |
          if [ ! -f "${{ inputs.arquivo }}" ]; then
            echo "Arquivo nao encontrado: ${{ inputs.arquivo }}"
            exit 1
          fi

      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
          NOTAS: ${{ inputs.notas }}
          ARQUIVO: ${{ inputs.arquivo }}
        run: |
          gh release create "$VERSAO" "$ARQUIVO" \
            --title "Financeiro Master Pro $VERSAO" \
            --notes "$NOTAS"

      - name: Remover ZIP do repositorio
        run: |
          git config user.name "Financeiro Master Pro Automacao"
          git config user.email "actions@users.noreply.github.com"
          git rm "${{ inputs.arquivo }}"
          git commit -m "Remover pacote publicado ${{ inputs.versao }}"
          git push

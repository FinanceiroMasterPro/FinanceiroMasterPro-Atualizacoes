name: Previa Windows cinco telas 506
on:
  push:
    branches: [main]
    paths: ['.github/validacao/previa506.zip', '.github/workflows/previa506.yml']
permissions:
  contents: read
jobs:
  previa:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Preparar previa compilada sem publicar
        shell: pwsh
        run: |
          if ((Get-FileHash .github/validacao/previa506.zip -Algorithm SHA256).Hash -ne '57f4d7796dc3418f6465e757d3d7b4f8c79353326dcd2d0d365119525e68f2e3') { throw 'Binarios divergentes' }
          Invoke-WebRequest 'https://github.com/FinanceiroMasterPro/FinanceiroMasterPro-Atualizacoes/releases/download/2026.505/FinanceiroMasterPro_Atualizacao_2026.505_FINAL.zip' -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash -ne 'da01123fcf6f36fadb6e2a979a4b526feedddd2bce1ebbaf121411ab56dc455a') { throw 'Base divergente' }
          Expand-Archive base.zip -DestinationPath previa
          Expand-Archive .github/validacao/previa506.zip -DestinationPath previa -Force
          if ((Get-FileHash .github/validacao/teste506.zip -Algorithm SHA256).Hash -ne 'b495d4612e9842f522de111c3801b1d01e435ea53931d82061ce923f5f2f9126') { throw 'Teste divergente' }
          Expand-Archive .github/validacao/teste506.zip -DestinationPath previa -Force
      - name: Preparar estilos a partir dos recursos compilados
        shell: pwsh
        run: |
          New-Item -ItemType Directory style-extractor -Force | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Reference Include="FinanceiroMasterPro"><HintPath>../previa/FinanceiroMasterPro.dll</HintPath></Reference></ItemGroup></Project>
          '@ | Set-Content style-extractor/Extrair.csproj
          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Windows.Markup;
          using System.Xml.Linq;
          class Program {
           [STAThread]static void Main(string[] args){
            var app=new FinanceiroMasterPro.Desktop.App();app.InitializeComponent();
            var dic=XElement.Parse(XamlWriter.Save(app.Resources));
            var ns=XNamespace.Get("http://schemas.microsoft.com/winfx/2006/xaml/presentation");
            var declaracoes=dic.Attributes().Where(x=>x.IsNamespaceDeclaration).ToArray();
            foreach(var estilo in dic.Elements())foreach(var d in declaracoes)if(estilo.Attribute(d.Name)==null)estilo.Add(new XAttribute(d));
            var documento=new XElement(ns+"Application",new XElement(ns+"Application.Resources",dic.Elements()));
            File.WriteAllText(args[0],documento.ToString());
            Console.WriteLine("Estilos extraidos dos recursos compilados: "+dic.Elements().Count());
            Environment.Exit(0);
           }
          }
          '@ | Set-Content style-extractor/Program.cs
          dotnet build style-extractor/Extrair.csproj -c Release -o style-extractor/bin
          if ($LASTEXITCODE -ne 0) { throw 'Extrator de recursos nao compilou.' }
          Copy-Item previa/* style-extractor/bin/ -Recurse -Force
          dotnet style-extractor/bin/Extrair.dll AppEstilos.xaml
          if ($LASTEXITCODE -ne 0) { throw 'Estilos compilados nao extraidos.' }
          Copy-Item AppEstilos.xaml previa/AppEstilos.xaml
      - name: Testar sequencia de transferencias e capturar cinco telas WPF
        shell: pwsh
        run: |
          dotnet previa/PreviaImportacao506.dll
          if ($LASTEXITCODE -ne 0) { throw 'Teste real falhou' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previa506-telas-reais
          path: validacao-previa506/*.png
